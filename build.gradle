plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom ja adiciona os repositorios essenciais (Mojang, Fabric) automaticamente.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // A partir da 1.21.11 o Fabric usa as Mojang Mappings oficialmente.
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// ---------------------------------------------------------------------
// Tarefa de DIAGNOSTICO temporaria: imprime os metodos publicos reais de
// uma classe do jogo, usando o javap (ferramenta que ja vem no JDK) contra
// o classpath resolvido pelo Loom. Util quando uma API mudou de assinatura
// numa versao muito nova e precisamos ver o que realmente existe.
// Uso: ./gradlew inspectClass -PclassName=net.minecraft.client.renderer.rendertype.RenderType
// Pode apagar esse bloco inteiro depois que nao precisar mais dele.
// ---------------------------------------------------------------------
tasks.register('inspectClass', Exec) {
    def javapExe = "${System.getProperty('java.home')}/bin/javap"
    def cp = sourceSets.main.compileClasspath.asPath
    def target = project.findProperty('className') ?: 'net.minecraft.client.renderer.rendertype.RenderType'
    commandLine javapExe, '-cp', cp, '-public', target
}

